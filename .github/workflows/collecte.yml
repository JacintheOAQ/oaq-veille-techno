name: Collecte hebdomadaire

on:
  schedule:
    # Tous les lundis a 11 h 00 UTC, soit 7 h a Montreal l'ete et 6 h l'hiver
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Preparer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lancer la collecte
        id: collecte
        run: python scripts/collecte.py

      - name: Enregistrer les nouveautes
        run: |
          git config user.name "Collecte automatique"
          git config user.email "actions@github.com"
          git add donnees/candidats.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Collecte du $(date -u +%Y-%m-%d) : ${{ steps.collecte.outputs.nouveaux }} nouveaux candidats"
            git push
          fi

      - name: Ouvrir un billet de rappel
        if: steps.collecte.outputs.nouveaux != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Triage du $(date -u +%Y-%m-%d) : ${{ steps.collecte.outputs.nouveaux }} nouveaux documents" \
            --body "La collecte a depose ${{ steps.collecte.outputs.nouveaux }} nouveaux documents dans donnees/candidats.json.

          Marche a suivre : telecharger donnees/candidats.json et donnees/veille.json, les ouvrir dans la console de triage, puis televerser les trois fichiers produits.

          Detail de la collecte : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Fermer ce billet une fois le triage fait."

Ajout de la collecte automatique
